<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .conteiner{
            background-color: greenyellow;
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: center;
            align-content: end;

            
            height: 300px;
            border: 1px solid black;
        }

        .item{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            padding: 3px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de flexbox A</div>
        <div class="item">Exemplo de flexbox B</div>
        <div class="item">Exemplo de flexbox C</div>
        <div class="item">Exemplo de flexbox D</div>
        <div class="item">Exemplo de flexbox E</div>
        <div class="item">Exemplo de flexbox F</div>
        <div class="item">Exemplo de flexbox G</div>
    </div>
</body>
</html>
