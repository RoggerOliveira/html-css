<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .pai{
            display: flex;
            background-color: aqua;
            border: 1px solid black;
            border-radius: 6px;
            flex-flow: row nowrap;
            
        }

        .filho{
            flex-basis: 200px;
            text-align: center;
            border: 1px solid black;
            
        }

        #cxA{
            flex-grow: 0;
            flex-shrink: 1;
        }

        #cxB{
            flex-grow: 1;
            flex-shrink: 0;
        }

        #cxC{
            flex-grow: 0;
            flex-shrink: 1;
        }
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho" id="cxA">A</div>
        <div class="filho" id="cxB">B</div>
        <div class="filho" id="cxC">C</div>
    </div>
</body>
</html>
