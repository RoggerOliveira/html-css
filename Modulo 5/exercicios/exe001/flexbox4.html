<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .conteiner{
            display: flex;
            background-color: aqua;
            border: 1px solid black;
            flex-flow: row wrap;
            height: 200px;
            justify-content: center;
            
        }

        .item{
            background-color: orange;
            
            text-align: center;
            border: 1px solid white;
            flex-basis: 50px;
        }

        #i3{
            align-self: center;
            flex-basis: 300px;
            height: 50px;
        }

        #i4{
            align-self: center;
        }

        .item2{
            background-color: darksalmon;
            align-self: flex-end;
            border: 1px solid white;
            flex-basis: 60px;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>

        <div class="item2" id="i7">G</div>
        <div class="item2" id="i8">H</div>
        <div class="item2" id="i9">I</div>
    </div>
</body>
</html>
