<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .conteiner{
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            height: 250px;
            align-items: center;

            
        }

        .item{
            text-align: center;
            background-color: pink;
            border: 2px solid black;
            padding: 3px;
            width: 140px;
            flex: auto;
            
            
        }

        #d{
            margin-left: 2px;
            margin-right: 2px;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de flexbox A</div>
        <div class="item">Exemplo de flexbox B</div>
        <div class="item">Exemplo de flexbox C</div>
        <div class="item" id="d">Exemplo de flexbox D</div>
        <div class="item">Exemplo de flexbox E</div>
        <div class="item">Exemplo de flexbox F</div>
        <div class="item">Exemplo de flexbox G</div>
    </div>
    
</body>
</html>
