<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .conteiner{
            display: flex;
            background-color: aquamarine;
            border: 1px solid black;
            flex-flow: row wrap;
            height: 300px;
        }

        .item{
            background-color: rgba(153, 50, 204, 0.705);
            flex: auto;
            text-align: center;
            border: 1px solid white;
        }
        #i1{
            order: 2;
            align-self:flex-end ;
        }

        #i2{
            order: 0;
            align-self:flex-start ;
        }

        #i3{
            order: 0;
            align-self: flex-start;
        }

        #i4{
            align-self: last baseline;
        }

        #i7{
            order: -1;
            align-self: center;
        }

        


    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
