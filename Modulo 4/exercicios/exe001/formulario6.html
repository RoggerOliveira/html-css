<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="" method="post" autocomplete="on">
        <fieldset>
            <legend>Formulário</legend>
            <p><label for="icor">Cor</label>
            <input type="color" name="icor" id="icor" value="#00ff00" ><br>
            </p>
            <p>
                <label for="inivel">Nível de satisfação</label>
                <input type="range" name="inivel" id="inivel" min="1" max="5" value="3" ><br>
            </p>
            <p>
                <label for="ifoto">Foto de perfil: </label>
                <input type="file" name="ifoto" id="ifoto" required>
            </p>
            
        </fieldset>
        <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
