<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form autocomplete="on" method="post">
        <p><label for="inome">Nome:</label>
            <input type="text" name="inome" id="inome" required minlength="5" maxlength="50" size="15" placeholder="Nome do usuário" autocomplete="username">
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="isenha" id="isenha" required minlength="8" maxlength="15" size="15" placeholder="Senha do usuário" autocomplete="current-password">
        </p>
        <p>
            <label for="iletivo">Período Letivo:</label>
            <input type="month" name="iletivo" id="iletivo" value="2025-11">
        </p>
        <p>
            <label for="idata">Data:</label>
            <input type="date" name="idata" id="idata" value="2025-11-27">
        </p>
        <p>
            <label for="ihora">Hora:</label>
            <input type="time" name="ihora" id="ihora">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
