<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
        <form>
            <fieldset>
                <legend>Dados pessoais</legend>
                <p>
                    <label for="inome">Nome:</label>
                    <input type="text" name="inome" id="inome" required minlength="3" maxlength="40" placeholder="Nome do Usuário">
                </p>
                <p>
                    <label for="imail">E-mail:</label>
                    <input type="email" name="imail" id="imail" required placeholder="EmailUsuário@.com">
                </p>
                <p>
                    <label for="ifone">Telefone:</label>
                    <input type="tel" name="ifone" id="ifone" required autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx)xxxx-xxxx">
                </p>
                <!--Estudar sobre RegEx-->
                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
                
            </fieldset>
        </form>
</body>
</html>
