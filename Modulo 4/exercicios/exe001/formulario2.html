<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <!--O method="post" é para coisas que não exigam segurança de dados específica-->
    <!--Para criptografar os dados tem de usar o HTTPS-->
    <form action="cadastro.php" method="post" autocomplete="off">
        <!--Label cria relação entre o nome da caixa e a caixa-->
        <p><label for="inome">Nome:</label>
             <input type="text" name="nome" id="inome"></p>
        <p><label for="isobrenome">Sobrenome:</label>
             <input type="text" name="sobrenome" id="isobrenome"></p>

        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
