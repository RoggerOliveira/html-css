<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="#" method="post" autocomplete="on">
        <p>
            <label for="inumero">1° número:</label>
            <input type="number" name="n1" id="inumero" min="0" max="50" required oninput="isoma.innerHTML = Number(inumero.value) + Number(inumero2.value)">
        </p>
        <p>
            <label for="inumero2">2° número:</label>
            <input type="number" name="n2" id="inumero2" min="0" max="50" required oninput="isoma.innerHTML = Number(inumero.value) + Number(inumero2.value)">
        </p>

        <p>
            <label for="isoma">Soma:</label>
            <output name="soma" id="isoma">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
