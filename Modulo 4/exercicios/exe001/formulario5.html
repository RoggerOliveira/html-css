<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form autocomplete="" method="post">
        <fieldset>
        <legend>Sexo</legend>
        <p>
            <label for="imasculino">Maculino</label>
            <input type="radio" name="sexo" id="imasculino" required><br>

            <label for="ifeminino">Feminino</label>
            <input type="radio" name="sexo" id="ifeminino" required><br>
        </p>

        </fieldset>
        <fieldset>
            <legend>Esportes</legend>
            <input type="checkbox" name="ifutebol" id="ifutebol" checked>
            <label for="ifutebol">Futebol</label><br>
            <input type="checkbox" name="inatacao" id="inatacao">
            <label for="inatacao">Natação</label><br>
            <input type="checkbox" name="ivolei" id="ivolei" checked>
            <label for="ivolei">Voleibol</label><br>
            <input type="checkbox" name="ibasquete" id="ibasquete">
            <label for="ibasquete">Basquete</label>

        </fieldset><br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
